name: Build HackJail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o HackJail.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: HackJail/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: HackJail
      - run: ls -la HackJail
      - uses: actions/upload-artifact@v4
        with:
          name: HackJail
          path: HackJail/HackJail.jar
          if-no-files-found: error
